# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "B",      # bugbear
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "RUF",    # ruff
    "SIM",    # simplify
    "UP",     # pyupgrade
    "W",      # warnings
    "ASYNC",  # async-Fehler
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.uba_lqi"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
